        <section class="app-view" id="view-gradebook">
          <div class="toolbar-flex">
            <div class="filter-group">
              <label for="grade-class-select" style="font-size: 0.825rem; font-weight: 600;">Pilih Kelas:</label>
              <select id="grade-class-select" class="select-filter" onchange="GradebookModule.onClassChange(this.value)">
                <!-- Dynamically populated -->
              </select>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <button class="btn btn-primary btn-sm" onclick="GradebookModule.openInputModal()" title="Input nilai tugas atau ujian siswa">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                <span>+ Input Nilai Siswa</span>
              </button>
              <button class="btn btn-secondary btn-sm" onclick="GradebookModule.openWeightModal()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                <span>Atur Bobot</span>
              </button>
              <button class="btn btn-dark btn-sm" onclick="PrintModule.printGradebook()" title="Cetak Buku Nilai Kelas Terpilih ke PDF Resmi">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                <span>Cetak Nilai (PDF)</span>
              </button>
              <button class="btn btn-primary btn-sm" onclick="GradebookModule.exportExcel()" title="Unduh Tabel Excel Resmi Bergaris dengan AutoFilter & Ringkasan Nilai">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span>Excel (.xls)</span>
              </button>
              <button class="btn btn-secondary btn-sm" onclick="GradebookModule.exportCSV()" title="Unduh Data Mentah CSV (UTF-8)">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>CSV</span>
              </button>
            </div>
          </div>

          <!-- Formula & Weight Banner -->
          <div class="grade-weight-banner">
            <div>
              <strong>Formula Perhitungan Nilai Akhir:</strong>
              <span style="color: var(--slate-600); margin-left: 4px;">(Rata-rata Tugas &times; Bobot) + (UTS &times; Bobot) + (UAS &times; Bobot)</span>
            </div>
            <div class="weight-tags">
              <span class="weight-pill">Tugas: <strong id="weight-display-tugas">30%</strong></span>
              <span class="weight-pill">UTS/STS: <strong id="weight-display-uts">30%</strong></span>
              <span class="weight-pill">UAS/SAS: <strong id="weight-display-uas">40%</strong></span>
            </div>
          </div>

          <!-- Responsive Table -->
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 40px; text-align: center;">No</th>
                  <th>Identitas Siswa</th>
                  <th style="text-align: center;">Tugas 1</th>
                  <th style="text-align: center;">Tugas 2</th>
                  <th style="text-align: center;">Rata Tugas</th>
                  <th style="text-align: center;">UTS / STS</th>
                  <th style="text-align: center;">UAS / SAS</th>
                  <th style="text-align: center;">Nilai Akhir</th>
                  <th style="text-align: center;">Predikat</th>
                  <th style="text-align: center; width: 90px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="gradebook-table-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </section>
