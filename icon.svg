<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Academic Emblem -->
  <g filter="url(#softShadow)" transform="translate(0, -6)">
    <!-- Open Book Pages Left & Right -->
    <!-- Left Page -->
    <path d="M256 368 C220 342 165 334 116 338 L116 178 C165 174 220 182 256 208 Z" 
          fill="#ffffff" />
    <!-- Right Page -->
    <path d="M256 368 C292 342 347 334 396 338 L396 178 C347 174 292 182 256 208 Z" 
          fill="#f1f5f9" />
    
    <!-- Book Spine & Center Crease -->
    <path d="M256 208 L256 372" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Content Lines on Pages (Abstract Text Lines) -->
    <!-- Left Lines -->
    <line x1="146" y1="216" x2="226" y2="226" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="146" y1="248" x2="226" y2="258" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="146" y1="280" x2="216" y2="290" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <!-- Right Lines -->
    <line x1="286" y1="226" x2="366" y2="216" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="286" y1="258" x2="366" y2="248" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="286" y1="290" x2="356" y2="280" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

    <!-- Golden Graduation Cap (Toga) atop Center -->
    <polygon points="256,92 376,142 256,192 136,142" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="3" />
    <!-- Cap Under-band -->
    <path d="M196 168 L196 198 C196 222 316 222 316 198 L316 168 Z" fill="#ca8a04" />
    <!-- Cap Tassel Ribbon -->
    <path d="M376 142 L392 208 C392 216 384 220 380 220" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
    <circle cx="380" cy="226" r="6" fill="#fef08a" />
  </g>

  <!-- Sparkle Star Accent (Excellence) -->
  <path d="M256 400 L262 416 L278 422 L262 428 L256 444 L250 428 L234 422 L250 416 Z" fill="url(#goldGrad)" />
</svg>
