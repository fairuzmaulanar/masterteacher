        <section class="app-view" id="view-classroom">
          <div class="toolbar-flex">
            <div class="filter-group">
              <label for="classroom-class-select" style="font-size: 0.825rem; font-weight: 600;">Kelas Aktif:</label>
              <select id="classroom-class-select" class="select-filter" onchange="ClassroomModule.onClassChange(this.value)">
                <!-- Dynamically populated -->
              </select>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <button class="btn btn-secondary btn-sm" onclick="ClassroomModule.openManageClassesModal()" title="Tambah atau ubah daftar kelas mengajar">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span>+ Kelola Kelas</span>
              </button>
              <button class="btn btn-secondary btn-sm" onclick="PrintModule.printClassroom()" title="Cetak Rekap Presensi & Data Siswa Kelas ke PDF">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                <span>Cetak Presensi (PDF)</span>
              </button>
              <button class="btn btn-primary btn-sm" onclick="ClassroomModule.openAddStudentModal()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                <span>+ Tambah Siswa Baru</span>
              </button>
            </div>
          </div>

          <!-- Subtabs -->
          <div class="classroom-subnav">
            <button class="subnav-btn active" data-subtab="students" onclick="ClassroomModule.switchSubTab('students')">Daftar Siswa & Karakter</button>
            <button class="subnav-btn" data-subtab="attendance" onclick="ClassroomModule.switchSubTab('attendance')">Pencatatan Presensi (Absensi)</button>
            <button class="subnav-btn" data-subtab="seating" onclick="ClassroomModule.switchSubTab('seating')">Denah Tempat Duduk</button>
            <button class="subnav-btn" data-subtab="picker" onclick="ClassroomModule.switchSubTab('picker')">Pengacak Nama Siswa</button>
          </div>

          <!-- Pane 1: Student List -->
          <div id="pane-students" class="classroom-pane">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width: 40px; text-align: center;">No</th>
                    <th>Nama Lengkap</th>
                    <th>NISN</th>
                    <th>Gender</th>
                    <th>Catatan Anekdot & Karakter</th>
                    <th style="text-align: right;">Aksi</th>
                  </tr>
                </thead>
                <tbody id="student-table-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- Pane 2: Attendance -->
          <div id="pane-attendance" class="classroom-pane" style="display: none;">
            <div style="background: var(--white); border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <label for="attendance-date-picker" style="font-size: 0.85rem; font-weight: 600;">Pilih Tanggal:</label>
                <input type="date" id="attendance-date-picker" class="form-control" style="width: auto;" onchange="ClassroomModule.renderAttendance()">
              </div>
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span id="attendance-recap-text" style="font-size: 0.85rem; font-weight: 700; color: var(--emerald-700);"></span>
                <button class="btn btn-secondary btn-sm" onclick="ClassroomModule.markAllPresent()">Tandai Semua Hadir (H)</button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width: 50px; text-align: center;">No</th>
                    <th>Nama Siswa</th>
                    <th style="text-align: center;">Status Presensi</th>
                  </tr>
                </thead>
                <tbody id="attendance-list-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- Pane 3: Seating Chart -->
          <div id="pane-seating" class="classroom-pane" style="display: none;">
            <div class="seating-chart-board">
              <div class="teacher-podium">PAPAN TULIS / MEJA GURU (DEPAN KELAS)</div>
              <div class="desk-grid" id="seating-chart-grid">
                <!-- Dynamically populated -->
              </div>
            </div>
          </div>

          <!-- Pane 4: Random Student Picker -->
          <div id="pane-picker" class="classroom-pane" style="display: none;">
            <div class="picker-container">
              <div class="picker-display">
                <div class="picker-name" id="picker-result-name">Siap Memilih Siswa</div>
                <div class="picker-sub" id="picker-result-sub">Tekan tombol di bawah untuk memilih acak</div>
              </div>
              <button class="btn btn-primary" id="btn-spin-picker" style="padding: 0.75rem 2rem; font-size: 1rem;" onclick="ClassroomModule.spinStudentPicker()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>Putar Pengacak Nama Siswa</span>
              </button>
            </div>
          </div>
        </section>
