<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Master Teacher Planner — Ruang Kerja Guru</title>
  <meta name="description" content="Rencanakan RPP Pembelajaran Mendalam, presensi, bank soal, buku nilai, dan rapor dalam satu aplikasi. Bisa offline, tersinkron otomatis.">
  <meta name="theme-color" content="#12245B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Master Teacher">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="modulepreload" href="./js/app.js">
  <script>
    // Terapkan tema & ukuran huruf sebelum render (hindari kedipan)
    try {
      var p = JSON.parse(localStorage.getItem('mtp_prefs') || '{}');
      var dark = p.tema === 'gelap' || (p.tema === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.dataset.theme = 'dark';
      if (p.huruf) document.documentElement.style.setProperty('--fs', p.huruf);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div style="min-height:100dvh;display:grid;place-items:center;font-family:system-ui;color:#12245B">
      <div style="text-align:center">
        <div style="width:56px;height:56px;border-radius:50%;background:#FFC531;margin:0 auto 12px"></div>
        <b>Master Teacher</b><br><small style="color:#4A5578">Memuat ruang kerja…</small>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Aplikasi ini memerlukan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  <script src="./js/config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
